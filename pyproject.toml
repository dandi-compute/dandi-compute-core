[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dandi_compute_code"]



[project]
name = "dandi-compute-code"
version = "0.9.5"
authors = [
  { name="Cody Baker", email="cody.c.baker.phd@gmail.com" },
]
description = "Contains essential code for performing computations on DANDI assets."
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
dependencies = [
    "beartype",
    "jinja2",
    "click",  # rich-click did not work well on Engaging
    "dandi",
    "linkml-runtime>=1.10.0,<1.11",
]


[project.scripts]
dandicompute = "dandi_compute_code._cli:_dandicompute_group"

[dependency-groups]
dev = ["ipython", "pre-commit", "pytest"]
# The full LinkML distribution, used only to validate the packaged schemas and the files
# shipped against them. It compiles a schema to JSON Schema and validates against that, which
# rejects the mismatched scalars the `linkml-runtime` validator normalizes instead. It is too
# heavy to carry at runtime, so the CI schema validation job installs it separately.
schemas = ["linkml>=1.8"]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
    "sphinxcontrib-mermaid>=1.0",
]
all = [
    {include-group = "dev"},
    {include-group = "docs"},
    {include-group = "schemas"},
]



[tool.pytest.ini_options]
markers = [
    "ai_generated: marks tests as AI-generated (deselect with '-m \"not ai_generated\"')",
]



[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.toml
  |\.yml
  |\.txt
  |\.sh
  |\.git
  |\.ini
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
exclude = [
  "*/__init__.py"
]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = [
    "PTH123",
    "D203",
    "D212",
    "T201",
    "FIX002",
    "TD003",
    "TD002",
    "S101",
    "ICN001",
    "INP001",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["dandi_compute_code"]

[tool.ruff.lint.per-file-ignores]
"src/dandi_compute_code/_hidden_top_level_imports.py" = ["F401"]  # Must perform imports here even if not exposed
