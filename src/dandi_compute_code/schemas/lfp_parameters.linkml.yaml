id: https://github.com/dandi-compute/dandi-compute-core/schemas/lfp_parameters
name: dandi_compute_lfp_parameters
title: DANDI Compute LFP Extraction Parameters
description: >-
  A LinkML schema describing the minimal set of parameters exposed by the DANDI Compute
  LFP extraction pipeline. This schema is owned by this pipeline. Some fields correspond
  to concepts in the AIND ephys parameters schema
  (https://github.com/dandi-compute/aind-ephys-pipeline/blob/main/pipeline/default_params_schema.json).
  Others are custom to this pipeline. Each field notes its SpikeInterface mapping and
  whether it aligns with the AIND schema or is custom.
prefixes:
  linkml: https://w3id.org/linkml/
  dandi_compute: https://github.com/dandi-compute/dandi-compute-core/schemas/
default_prefix: dandi_compute
default_range: string
imports:
  - linkml:types
enums:
  FilterFamily:
    description: >-
      Filter design family, forwarded to SpikeInterface `bandpass_filter` as `ftype`.
      Custom to this pipeline. The AIND schema does not expose the filter family.
    permissible_values:
      butter:
      bessel:
      fir:
  FilterDirection:
    description: >-
      A single forward (causal) pass or a forward-backward (zero-phase) pass, mapped to
      SpikeInterface `bandpass_filter` `direction`. Custom to this pipeline.
    permissible_values:
      causal:
      zero-phase:
  ReferenceScheme:
    description: >-
      Re-referencing scheme, mapped to SpikeInterface `common_reference`.
    permissible_values:
      none:
        description: Skips referencing entirely.
      CMR:
        description: >-
          A global median reference, matching AIND `common_reference` with reference=global
          and operator=median.
      per-shank median:
        description: References within each shank group.
  FilterBand:
    description: >-
      The bandpass edges the pipeline supports, each written as "freq_min-freq_max" in Hz.
      A parameters file carries the two edges as numbers rather than as one of these tokens,
      so this enumeration is what states which pairs of edges are allowed. A loader formats
      the pair it read the same way and checks it against these values.
    permissible_values:
      0.1-300:
      0.5-250:
      0.5-500:
      1-400:
  FilterOrder:
    description: >-
      The filter orders the pipeline supports. Carried in a parameters file as a number, so
      the allowed set is stated here and checked by a loader, the way `FilterBand` is.
    permissible_values:
      "2":
      "4":
      "8":
  ResampleTargetFs:
    description: >-
      The target LFP sampling frequencies in Hz the pipeline supports. Carried in a
      parameters file as a number, and checked the way `FilterOrder` is.
    permissible_values:
      "1000":
      "1250":
      "2500":
  SpatialFactor:
    description: >-
      The spatial decimation factors the pipeline supports. Carried in a parameters file as
      a number, and checked the way `FilterOrder` is.
    permissible_values:
      "1":
      "4":
  BadChannelMethod:
    description: >-
      SpikeInterface `detect_bad_channels` method, or "none" to skip. Detected channels are
      removed before filtering. Corresponds to the AIND `detect_and_remove_bad_channels.method`
      field.
    permissible_values:
      none:
      coherence+psd:
      neighborhood_r2:
classes:
  LfpParameters:
    description: >-
      One complete set of LFP extraction parameters, as stored in a file under the pipeline's
      `params/` directory. Every field is required, so a parameters file always states the
      whole configuration rather than leaning on defaults applied somewhere else.
    tree_root: true
    attributes:
      filter_family:
        description: >-
          Filter design family, forwarded to SpikeInterface `bandpass_filter` as `ftype`.
        range: FilterFamily
        required: true
      filter_band:
        description: >-
          The (freq_min, freq_max) bandpass edges in Hz, forwarded to SpikeInterface
          `bandpass_filter`. Corresponds to the AIND `lfp.filter.{freq_min, freq_max}` fields.
          Written low edge first, and restricted to the pairs the `FilterBand` enum lists.
          That restriction is on the pair rather than on either edge, so it is carried by
          that enum instead of by bounds on this slot.
        range: float
        multivalued: true
        exact_cardinality: 2
        minimum_value: 0
        maximum_value: 30000
        required: true
      filter_order:
        description: >-
          Filter order, forwarded to SpikeInterface `bandpass_filter` as `filter_order`.
          Corresponds to the AIND highpass filter order, restricted to the `FilterOrder` set.
        range: integer
        minimum_value: 1
        required: true
      filter_direction:
        description: >-
          Whether the bandpass filter runs as a single causal pass or a zero-phase
          forward-backward pass.
        range: FilterDirection
        required: true
      reference_scheme:
        description: The re-referencing applied before resampling.
        range: ReferenceScheme
        required: true
      resample_target_fs:
        description: >-
          Target LFP sampling frequency in Hz, forwarded to SpikeInterface `resample`.
          Corresponds to the AIND `lfp.sampling_rate` field, restricted to the
          `ResampleTargetFs` set.
        range: integer
        minimum_value: 1
        required: true
      spatial_factor:
        description: >-
          Spatial decimation factor. 1 keeps every channel, 4 keeps every fourth channel
          ordered by depth. Corresponds to the AIND `lfp_spatial_factor` field, restricted
          to the `SpatialFactor` set.
        range: integer
        minimum_value: 1
        required: true
      bad_channel_method:
        description: The bad channel detection method applied before filtering.
        range: BadChannelMethod
        required: true
