[project]
name = "dandi-compute-lfp-env"
version = "0.1.0"
requires-python = ">=3.10"
# Runtime dependencies for the LFP pipeline (dandi_compute_code.lfp_pipeline).
# Installed into the pipeline container by containers/lfp.Dockerfile. Kept
# separate from the base package so that `import dandi_compute_code` stays light.
dependencies = [
    "spikeinterface",
    "neuroconv",
    # neuroconv reads `zarr.codec_registry`, which zarr 3 removed. Without this, pip takes the newest
    # zarr and backtracks to a neuroconv old enough not to forbid it, which then fails on import.
    "zarr<3",
    "pynwb",
    "numpy",
    "jsonschema",
    # The submission script runs duct inside the container to record resource usage.
    "con-duct",
]
